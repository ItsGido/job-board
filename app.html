<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Coomer Home Improvements — Subcontractor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEAE0;
    --paper-dark:#DFD9CB;
    --paper-light:#F6F3ED;
    --ink:#1C2733;
    --ink-soft:#5B6470;
    --denim:#26394D;
    --rust:#4E7FA8;
    --amber:#B5502F;
    --moss:#3F7A52;
    --line:#DFD9CB;
    --danger:#943E22;
    --gold:#A9C3DA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper-light);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:560px;margin:0 auto;padding:0 0 60px;}

  header{padding:20px 18px 14px;background:var(--denim);border-bottom:3px solid var(--rust);}
  header .brand{color:#fff;}
  header .brand-sub{color:var(--gold);}
  header .who{color:var(--gold);}
  header .who strong{color:#fff;}
  header .logout{color:#fff;}
  .brand{font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;letter-spacing:.3px;color:var(--ink);margin:0;}
  .brand-sub{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .who{text-align:right;font-size:12.5px;color:var(--ink-soft);}
  .who strong{display:block;color:var(--ink);font-size:14px;font-family:'Oswald',sans-serif;font-weight:600;}
  .logout{font-size:12px;color:var(--rust);cursor:pointer;text-decoration:underline;margin-top:3px;display:inline-block;}

  nav.tabs{display:flex;gap:5px;padding:0 12px;margin-top:14px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:1;min-width:76px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;
    padding:10px 5px;border:1.5px solid var(--line);border-bottom:none;
    background:var(--paper);color:var(--ink-soft);border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;
  }
  nav.tabs button.active{background:var(--paper-light);color:var(--ink);border-color:var(--ink);}
  main{padding:16px;border-top:1.5px solid var(--ink);background:var(--paper-light);min-height:60vh;}

  h2.section{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:var(--ink-soft);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  h2.section:first-child{margin-top:2px;}
  .count-badge{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;background:var(--paper-dark);color:var(--ink-soft);padding:1px 8px;border-radius:10px;}
  .hint{font-size:12.5px;color:var(--ink-soft);margin:-4px 0 14px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
  .field input, .field textarea, .field select{
    width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:6px;
    font-family:'Inter',sans-serif;font-size:15px;background:var(--paper-light);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--denim);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .btn{
    display:inline-block;font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
    padding:13px 18px;border-radius:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper-light);
    cursor:pointer;text-align:center;
  }
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn.danger.ghost{background:transparent;color:var(--danger);}
  .btn.block{width:100%;}
  .btn.small{padding:8px 12px;font-size:13px;}
  .btn:disabled{opacity:.5;cursor:default;}

  .msg{margin-top:12px;padding:12px 14px;border:1.5px dashed var(--moss);border-radius:6px;color:var(--moss);font-weight:600;font-size:14px;}
  .msg.error{border-color:var(--danger);color:var(--danger);}

  .card{background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;margin-bottom:14px;overflow:hidden;}
  .card-top{padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;}
  .card-sub{font-size:14px;color:var(--ink-soft);margin-top:3px;}
  .card-meta{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .card-meta div{margin-top:2px;}
  .pay{font-weight:700;color:var(--ink);}
  .card-photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .card-photos img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1.5px solid var(--line);}
  .stamp{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:11px;letter-spacing:.4px;
    padding:4px 8px;border:2px solid currentColor;border-radius:5px;transform:rotate(-3deg);white-space:nowrap;flex-shrink:0;
  }
  .stamp.new, .stamp.available{color:var(--rust);}
  .stamp.contacted, .stamp.offered, .stamp.processing{color:var(--amber);}
  .stamp.scoping, .stamp.accepted, .stamp.assigned, .stamp.scheduled{color:var(--denim);}
  .stamp.ready_to_create_job, .stamp.in_progress, .stamp.on_the_way{color:#7A5A9E;}
  .stamp.completed, .stamp.paid, .stamp.active{color:var(--moss);}
  .stamp.on_hold, .stamp.pending{color:var(--amber);}
  .stamp.closed, .stamp.cancelled, .stamp.disabled, .stamp.deleted, .stamp.declined, .stamp.void{color:var(--ink-soft);}

  .perf{height:0;border-top:2px dashed var(--line);}
  .card-body{padding:12px 14px 14px;}
  .status-buttons{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .status-buttons button{
    flex:1;min-width:80px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:9px 6px;border-radius:5px;border:1.5px solid var(--line);background:var(--paper-light);color:var(--ink-soft);cursor:pointer;
  }

  .empty{text-align:center;padding:32px 20px;color:var(--ink-soft);font-size:14px;border:1.5px dashed var(--line);border-radius:8px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .stat-grid.tri{grid-template-columns:1fr 1fr 1fr;}
  .stat{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:14px 12px;text-align:center;}
  .stat .num{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;}
  .stat .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;}
  .stat.owed .num{color:var(--rust);}
  .stat.paid .num{color:var(--moss);}

  .id-badge{
    font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.5px;font-size:13px;
    background:var(--denim);color:#fff;padding:3px 9px;border-radius:5px;display:inline-block;
  }

  .login-wrap{max-width:400px;margin:60px auto;padding:0 20px;}
  .login-toggle{display:flex;gap:8px;margin-bottom:22px;}
  .login-toggle button{
    flex:1;padding:10px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);
    color:var(--ink-soft);font-weight:600;font-size:13.5px;cursor:pointer;
  }
  .login-toggle button.active{background:var(--denim);border-color:var(--denim);color:#fff;}

  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-row button{
    padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper-light);
    color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .filter-row button.active{background:var(--ink);border-color:var(--ink);color:var(--paper-light);}
  .search-box{margin-bottom:12px;}

  table.ledger{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.ledger th{text-align:left;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;padding:6px 4px;border-bottom:1.5px solid var(--ink);}
  table.ledger td{padding:9px 4px;border-bottom:1px solid var(--line);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(43,38,32,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--paper-light);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:20px 18px 26px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-family:'Oswald',sans-serif;font-weight:600;margin:0 0 4px;}
  .modal .close{position:absolute;top:16px;right:20px;font-size:20px;color:var(--ink-soft);cursor:pointer;}
  .modal-inner{position:relative;}
  .checkline{display:flex;align-items:flex-start;gap:8px;font-size:14px;margin:14px 0;}
  .checkline input{width:auto;margin-top:3px;}

  .history-line{font-size:12.5px;color:var(--ink-soft);padding:6px 0;border-bottom:1px dashed var(--line);}
  .history-line:last-child{border-bottom:none;}

  .link-btn{color:var(--denim);text-decoration:underline;cursor:pointer;font-size:12.5px;font-weight:600;}

  footer{text-align:center;padding:20px 16px 0;font-size:12px;color:var(--ink-soft);}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">Loading…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const SUB_EMAIL_DOMAIN = 'subs.coomerhi.internal';
const ADMIN_EMAIL = 'coomerhomeimprovements@gmail.com';
emailjs.init({ publicKey: 'Q09gYijicA1O-h85i' });

function sendNotificationEmail({ to_email, subject, heading, body_html, footer_note }){
  emailjs.send('service_i3oreff', 'template_4sgo40e', { to_email, subject, heading, body_html, footer_note: footer_note||'' })
    .catch(err => console.error('Notification email failed to send', err));
}

/* ---------------- helpers ---------------- */
function esc(s){ return (s===undefined||s===null?'':s).toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function centsToStr(c){ c = c||0; const neg = c<0; c = Math.abs(c); const s = (c/100).toFixed(2); return (neg?'-':'')+'$'+s; }
function dollarsToCents(str){ const n = parseFloat((str||'').toString().replace(/[^0-9.\-]/g,'')); return Number.isFinite(n) ? Math.round(n*100) : 0; }
function estimateTaxCents(amountCents){
  const seTax = Math.round(amountCents * 0.153);
  const federal = Math.round(amountCents * 0.10);
  const vaState = Math.round(amountCents * 0.0575);
  return { seTax, federal, vaState, total: seTax + federal + vaState };
}

// Four non-overlapping windows covering the year, each keyed to the IRS quarterly
// estimated-tax deadline that falls inside it (Jan 15 / Apr 15 / Jun 15 / Sep 15).
// Whenever admin logs in during a window not yet sent-for, a reminder goes out —
// this is a nudge, not precision, so a slightly late send beats none at all.
function currentTaxReminderWindow(d){
  d = d || new Date();
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  if(m<=2) return { key: `${y}-W1`, label: 'Q4 estimated taxes (due Jan 15)' };
  if(m===3 || m===4 || (m===5 && day<=14)) return { key: `${y}-W2`, label: 'Q1 estimated taxes (due Apr 15)' };
  if((m===5 && day>=15) || m===6 || m===7 || (m===8 && day<=14)) return { key: `${y}-W3`, label: 'Q2 estimated taxes (due Jun 15)' };
  return { key: `${y}-W4`, label: 'Q3 estimated taxes (due Sep 15)' };
}
function sendTaxReminderEmail(sub, windowLabel, yearTotalCents, tax){
  sendNotificationEmail({
    to_email: sub.email,
    subject: `Quarterly Estimated Tax Reminder — ${windowLabel}`,
    heading: 'Quarterly Estimated Tax Reminder',
    body_html: `<p style="margin:0 0 16px;">Hi ${esc((sub.name||'').split(' ')[0])}, this is a reminder that ${esc(windowLabel)} may be coming up.</p>
      <table style="width:100%;border-collapse:collapse;">
        <tr><td style="padding:6px 0;font-weight:bold;width:220px;">Paid to you so far this year:</td><td>${centsToStr(yearTotalCents)}</td></tr>
        <tr><td style="padding:6px 0;font-weight:bold;">Est. total to set aside:</td><td>${centsToStr(tax.total)}</td></tr>
        <tr><td style="padding:6px 0;">Self-employment tax (15.3%):</td><td>${centsToStr(tax.seTax)}</td></tr>
        <tr><td style="padding:6px 0;">Federal income tax (est. 10%):</td><td>${centsToStr(tax.federal)}</td></tr>
        <tr><td style="padding:6px 0;">Virginia state tax (5.75%):</td><td>${centsToStr(tax.vaState)}</td></tr>
      </table>
      <p style="margin:16px 0 0;font-size:13px;color:#5B6470;">This is a rough planning estimate based on payments marked paid — not tax advice. Check with an accountant for your real numbers.</p>`,
    footer_note: "Log in to your subcontractor portal any time to see your full payout and tax history. Don't want these emails? Turn them off in the Profile tab."
  });
}
async function runTaxReminderCheck(force){
  try{
    const metaSnap = await db.collection('meta').doc('taxReminders').get();
    const lastSentKey = metaSnap.exists ? metaSnap.data().lastSentKey : null;
    const window = currentTaxReminderWindow();
    if(!force && lastSentKey === window.key) return { sent:false, count:0, label: window.label };
    const [subsSnap, payoutsSnap] = await Promise.all([
      db.collection('subcontractors').get(),
      db.collection('payouts').where('status','==','PAID').get()
    ]);
    const subs = subsSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(s=>s.status==='ACTIVE' && s.emailOptIn!==false && s.email);
    const payouts = payoutsSnap.docs.map(d=>d.data());
    const yearStart = new Date(new Date().getFullYear(),0,1).getTime();
    let count = 0;
    subs.forEach(s=>{
      const yearTotal = payouts.filter(p=>p.subcontractorId===s.id && p.paidAt && p.paidAt>=yearStart).reduce((sum,p)=>sum+(p.amountCents||0),0);
      if(yearTotal<=0) return;
      sendTaxReminderEmail(s, window.label, yearTotal, estimateTaxCents(yearTotal));
      count++;
    });
    await db.collection('meta').doc('taxReminders').set({ lastSentKey: window.key, lastSentAt: now() }, { merge:true });
    return { sent:true, count, label: window.label };
  }catch(err){
    console.error('tax reminder check failed', err);
    return { sent:false, count:0, error: err.message };
  }
}
function fmtDate(ts){ if(!ts) return ''; const d = ts instanceof Date ? ts : new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTime(ts){ if(!ts) return ''; const d = ts instanceof Date ? ts : new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ', ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function now(){ return Date.now(); }
function subIdToEmail(id){ return id.trim().toUpperCase().toLowerCase() + '@' + SUB_EMAIL_DOMAIN; }
function statusLabel(s){
  return (s||'').split('_').map(w=>w[0]+w.slice(1).toLowerCase()).join(' ');
}
function stampClass(s){ return (s||'').toLowerCase(); }

function pinToPassword(pin){ return pin + 'chi0'; }

async function restCreateAuthAccount(email, password){
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email, password, returnSecureToken:false })
  });
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'Could not create login');
  return data.localId;
}

/* ---------------- global state ---------------- */
let me = null;          // firebase auth user
let myRole = null;      // {role:'admin'} | {role:'subcontractor', subcontractorId}
let mySubDoc = null;    // subcontractors/{id} doc data, for subcontractor role
let activeTab = null;
let unsubs = [];

let adminData = { requests:[], jobs:[], subs:[], payouts:[], supportRequests:[], adminMileage:[], taxRemindersMeta:null };
let subData = { availableJobs:[], offeredJobs:[], myJobs:[], payouts:[], mileage:[] };

let openRequestId = null, openJobId = null, openSubId = null, openPayoutId = null, openSubPayoutId = null;
let mileageFilter = 'month';
let payoutFilter = 'all';
let summaryYear = new Date().getFullYear();

function clearListeners(){ unsubs.forEach(u=>u()); unsubs = []; }

/* ---------------- auth state ---------------- */
auth.onAuthStateChanged(async (user)=>{
  clearListeners();
  me = user;
  myRole = null; mySubDoc = null;
  if(!user){ renderLogin(); return; }
  try{
    const roleSnap = await db.collection('roles').doc(user.uid).get();
    if(!roleSnap.exists){ await auth.signOut(); renderLogin('Account not set up. Ask the admin to add you.'); return; }
    myRole = roleSnap.data();
    if(myRole.role === 'admin'){
      activeTab = activeTab && ['requests','dispatch','jobs','subs','payouts','inbox','mileage'].includes(activeTab) ? activeTab : 'requests';
      subscribeAdmin();
    }else if(myRole.role === 'subcontractor'){
      const subSnap = await db.collection('subcontractors').doc(myRole.subcontractorId).get();
      if(!subSnap.exists || subSnap.data().status !== 'ACTIVE'){
        await auth.signOut();
        renderLogin('This account is not active. Contact the admin.');
        return;
      }
      mySubDoc = subSnap.data();
      proceedAfterSubAuth();
    }else{
      await auth.signOut(); renderLogin('Unrecognized account type.');
    }
  }catch(e){
    console.error(e);
    renderLogin('Sign-in error — please try again.');
  }
});

/* ---------------- gates a subcontractor must clear before the dashboard ---------------- */
function proceedAfterSubAuth(){
  if(mySubDoc.mustChangePin){ renderSetPin(); return; }
  if(!mySubDoc.onboardingComplete){ renderOnboarding(); return; }
  activeTab = activeTab && ['home','available','myjobs','payouts','mileage','profile'].includes(activeTab) ? activeTab : 'home';
  subscribeSub();
}

/* ---------------- first-login: set a real PIN ---------------- */
function renderSetPin(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-wrap">
      <h1 class="brand" style="text-align:center;">Welcome, ${esc((mySubDoc.name||'').split(' ')[0])}</h1>
      <div class="brand-sub" style="text-align:center;margin-bottom:24px;">Set your own 4-digit PIN to finish logging in. Your temporary one won't work again.</div>
      <form id="setPinForm">
        <div class="field"><label>New 4-digit PIN</label><input id="np_pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>
        <div class="field"><label>Confirm PIN</label><input id="np_pin2" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>
        <div id="setPinMsg"></div>
        <button type="submit" class="btn block">Save PIN</button>
      </form>
    </div>
  `;
  document.getElementById('setPinForm').onsubmit = async (e)=>{
    e.preventDefault();
    const p1 = document.getElementById('np_pin').value.trim();
    const p2 = document.getElementById('np_pin2').value.trim();
    if(!/^\d{4}$/.test(p1) || p1!==p2){
      document.getElementById('setPinMsg').innerHTML = '<div class="msg error">PINs must match and be 4 digits.</div>';
      return;
    }
    try{
      await auth.currentUser.updatePassword(pinToPassword(p1));
      await db.collection('subcontractors').doc(myRole.subcontractorId).update({ mustChangePin: false });
      mySubDoc.mustChangePin = false;
      proceedAfterSubAuth();
    }catch(err){
      document.getElementById('setPinMsg').innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
    }
  };
}

/* ---------------- first-login: onboarding (1099 info) ---------------- */
function renderOnboarding(){
  const app = document.getElementById('app');
  const o = mySubDoc.onboarding || {};
  app.innerHTML =`
    <div class="login-wrap" style="max-width:480px;">
      <h1 class="brand" style="text-align:center;">Almost done, ${esc((mySubDoc.name||'').split(' ')[0])}</h1>
      <div class="brand-sub" style="text-align:center;margin-bottom:24px;">A few details for our records before you start seeing jobs.</div>
      <form id="onboardForm">
        <div class="field"><label>Legal name</label><input id="ob_name" value="${esc(o.legalName||mySubDoc.name||'')}" required></div>
        <div class="field"><label>Address</label><input id="ob_address" value="${esc(o.address||'')}" required></div>
        <div class="field"><label>License number / type (if applicable)</label><input id="ob_license" value="${esc(o.license||'')}" placeholder="e.g. VA Class C #123456"></div>
        <label class="checkline"><input type="checkbox" id="ob_1099" required> I understand I am an independent contractor (1099), not an employee of Coomer Home Improvements.</label>
        <div id="onboardMsg"></div>
        <button type="submit" class="btn block">Continue</button>
      </form>
      <div class="hint" style="text-align:center;margin-top:10px;">Your husband/admin will follow up directly if he needs photos of your license.</div>
    </div>
  `;
  document.getElementById('onboardForm').onsubmit = async (e)=>{
    e.preventDefault();
    if(!document.getElementById('ob_1099').checked) return;
    try{
      const onboarding = {
        legalName: document.getElementById('ob_name').value.trim(),
        address: document.getElementById('ob_address').value.trim(),
        license: document.getElementById('ob_license').value.trim(),
        acknowledged1099: true,
        submittedAt: now()
      };
      await db.collection('subcontractors').doc(myRole.subcontractorId).update({ onboarding, onboardingComplete: true });

async function nextCounter(field, prefix, pad){
  const ref = db.collection('meta').doc('counters');
  return db.runTransaction(async (tx)=>{
    const snap = await tx.get(ref);
    const cur = (snap.exists && snap.data()[field]) || 0;
    const next = cur + 1;
    tx.set(ref, { [field]: next }, { merge:true });
    return prefix ? prefix + String(next).padStart(pad||4,'0') : next;
  });
}

function openAddSubModal(){

      <span class="close" id="closeModal">&times;</span>

      <form id="addSubForm">        <div class="field"><label>Name</label><input id="s_name" required></div>

          <div class="field"><label>Email</label><input id="s_email" type="email"></div>
        </div>
        <div class="field"><label>Trade(s) — comma separated</label><input id="s_trades" placeholder="Flooring, Drywall"></div>
        <div class="field"><label>Service area</label><input id="s_area" placeholder="Front Royal, Winchester"></div>
        <div class="field"><label>Notes</label><textarea id="s_notes"></textarea></div>

      <div id="addSubMsg"></div>
    </div></div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('closeModal').onclick = ()=> backdrop.remove();
  backdrop.onclick = (e)=>{ if(e.target===backdrop) backdrop.remove(); };
  document.getElementById('addSubForm').onsubmit = async (e)=>{
    e.preventDefault();
    const tempPin = String(Math.floor(1000 + Math.random()*9000));
    const btn = document.getElementById('addSubBtnSubmit'); btn.disabled = true; btn.textContent = 'Creating…';
    try{
      const id = await nextCounter('nextSubcontractorSeq', 'CHI-', 4);
      const email = subIdToEmail(id);
      const authUid = await restCreateAuthAccount(email, pinToPassword(tempPin));
      await db.collection('subLogins').doc(id).set({ email });
      await db.collection('subcontractors').doc(id).set({
        name: document.getElementById('s_name').value.trim(),
        phone: document.getElementById('s_phone').value.trim(),
        email: document.getElementById('s_email').value.trim(),
        trades: document.getElementById('s_trades').value.split(',').map(t=>t.trim()).filter(Boolean),
        serviceArea: document.getElementById('s_area').value.trim(),
        notes: document.getElementById('s_notes').value.trim(),
        status: 'ACTIVE',
        authUid,
        mustChangePin: true,
        createdAt: now()
      });
      await db.collection('roles').doc(authUid).set({ role:'subcontractor', subcontractorId: id });
      document.getElementById('addSubForm').style.display = 'none';

        <div class="msg">SUBCONTRACTOR CREATED<br><br>${esc(document.getElementById('s_name').value)}<br><br>
        Subcontractor ID:<br><span class="id-badge" style="font-size:16px;margin-top:4px;">${id}</span><br><br>

        <button class="btn block" id="doneAddSub" style="margin-top:12px;">Done</button>
      `;
      document.getElementById('doneAddSub').onclick = ()=> backdrop.remove();
    }catch(err){
      console.error(err);
      document.getElementById('addSubMsg').innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Create Subcontractor';
    }
  };
}
function renderSubDetail(main){
  const s = adminData.subs.find(x=>x.id===openSubId);
  if(!s){ openSubId=null; return renderSubsTab(main); }
  const subJobs = adminData.jobs.filter(j=>j.assignedSubcontractorId===s.id);
  const completed = subJobs.filter(j=>['COMPLETED','PAID'].includes(j.status)).length;
  const current = subJobs.filter(j=>!['COMPLETED','PAID','CANCELLED'].includes(j.status)).length;
  const subPayouts = adminData.payouts.filter(p=>p.subcontractorId===s.id);
  const totalPaidCents = subPayouts.filter(p=>p.status==='PAID').reduce((sum,p)=>sum+(p.amountCents||0),0);
  const outstandingCents = subPayouts.filter(p=>['PENDING','PROCESSING'].includes(p.status)).reduce((sum,p)=>sum+(p.amountCents||0),0);
  main.innerHTML = `
    <div class="link-btn" id="backBtn">&larr; Back to subcontractors</div>
    <h2 class="section" style="margin-top:14px;">${esc(s.name)} <span class="stamp ${stampClass(s.status)}">${statusLabel(s.status)}</span></h2>
    <span class="id-badge">${s.id}</span>
    <div class="card-meta" style="margin-top:12px;">
      <div>Phone: ${esc(s.phone)||'—'}</div>
      <div>Email: ${esc(s.email)||'—'}</div>
      <div>Trades: ${esc((s.trades||[]).join(', '))||'—'}</div>
      <div>Service area: ${esc(s.serviceArea)||'—'}</div>
      ${s.notes?`<div>Notes: ${esc(s.notes)}</div>`:''}
    </div>
    <div class="stat-grid tri" style="margin-top:16px;">
      <div class="stat"><div class="num">${completed}</div><div class="lbl">Completed</div></div>
      <div class="stat"><div class="num">${current}</div><div class="lbl">Current</div></div>
      <div class="stat owed"><div class="num">${centsToStr(outstandingCents)}</div><div class="lbl">Outstanding</div></div>
    </div>
    <div class="hint" style="margin-top:8px;">Total paid: ${centsToStr(totalPaidCents)}. Mileage records are private to the subcontractor and are not shown here.</div>
    <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px;">
      ${s.status==='ACTIVE' ? `<button class="btn secondary block" id="resetLoginBtn">Reset Login (forgot PIN)</button>` : ''}
      ${s.status==='ACTIVE' ? `<button class="btn secondary block" id="disableBtn">Disable Account</button>` : ''}
      ${s.status==='DISABLED' ? `<button class="btn secondary block" id="enableBtn">Re-enable Account</button>` : ''}
      ${s.status!=='DELETED' ? `<button class="btn danger block" id="deleteBtn">Permanently Delete Account</button>` : `<div class="msg error">This account has been permanently deleted.</div>`}  </div>
    <div id="subActionMsg"></div>
  `;
  document.getElementById('backBtn').onclick = ()=>{ openSubId=null; renderApp(); };
  const resetLoginBtn = document.getElementById('resetLoginBtn');
  if(resetLoginBtn) resetLoginBtn.onclick = async ()=>{
    if(!confirm(`Generate a new temporary PIN for ${s.name} (${s.id})? Their current PIN will stop working immediately.`)) return;
    resetLoginBtn.disabled = true; resetLoginBtn.textContent = 'Resetting…';
    try{
      const tempPin = String(Math.floor(1000 + Math.random()*9000));
      const newEmail = subIdToEmail(s.id + '-' + Date.now());
      const newAuthUid = await restCreateAuthAccount(newEmail, pinToPassword(tempPin));
      // Firebase requires a unique email per account — reissue using a fresh alias, keep the CHI id as the durable identity.
      // subLogins/{id} is the public pointer the login screen reads to find which alias is currently valid.
      await db.collection('roles').doc(newAuthUid).set({ role:'subcontractor', subcontractorId: s.id });
      await db.collection('subLogins').doc(s.id).set({ email: newEmail });
      if(s.authUid) await db.collection('roles').doc(s.authUid).delete().catch(()=>{});
      await db.collection('subcontractors').doc(s.id).update({ authUid: newAuthUid, mustChangePin: true });
      document.getElementById('subActionMsg').innerHTML = `
        <div class="msg">New temporary PIN for ${esc(s.name)} (${s.id}):<br><span class="id-badge" style="font-size:16px;margin-top:6px;">${tempPin}</span><br><br>
        Give it to them — they'll be asked to set their own permanent PIN on next login.</div>
      `;
    }catch(err){
      document.getElementById('subActionMsg').innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
    }
    resetLoginBtn.disabled = false; resetLoginBtn.textContent = 'Reset Login (forgot PIN)';
  };
  const disableBtn = document.getElementById('disableBtn');
  if(disableBtn) disableBtn.onclick = async ()=>{
    if(confirm(`Disable ${s.name} (${s.id})? They will not be able to log in, but their history stays intact.`)){
      await db.collection('subcontractors').doc(s.id).update({ status:'DISABLED' });
    }
  };  const enableBtn = document.getElementById('enableBtn');
  if(enableBtn) enableBtn.onclick = async ()=>{
    await db.collection('subcontractors').doc(s.id).update({ status:'ACTIVE' });
  };
  const deleteBtn = document.getElementById('deleteBtn');
  if(deleteBtn) deleteBtn.onclick = ()=> openDeleteSubModal(s);
}

  subs.forEach(s=>{
    const subPayouts = adminData.payouts.filter(p=>p.subcontractorId===s.id).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));    const owedCents = subPayouts.filter(p=>['PENDING','PROCESSING'].includes(p.status)).reduce((sum,p)=>sum+(p.amountCents||0),0);
    const paidCents = subPayouts.filter(p=>p.status==='PAID').reduce((sum,p)=>sum+(p.amountCents||0),0);
    html += `
      <div class="card">
        <div class="card-top" data-open-sub-payout="${s.id}" style="cursor:pointer;">
          <div><div class="card-title">${esc(s.name)}</div><span class="id-badge">${s.id}</span></div>

            <div>Paid to date: ${centsToStr(paidCents)}</div>
          </div>
          ${subPayouts.length ? subPayouts.map(p=>`
            <div class="history-line" data-open-payout="${p.id}" data-sub="${s.id}" style="cursor:pointer;display:flex;justify-content:space-between;gap:10px;">
              <span>${p.paidAt ? fmtDate(p.paidAt) : (p.completedAt?fmtDate(p.completedAt):fmtDate(p.createdAt))} — ${p.jobId?`Job #${p.jobNumber}`:'Payment'}</span>

  document.getElementById('sendTaxRemindersBtn').onclick = async ()=>{

    const result = await runTaxReminderCheck(true);
    if(result.sent) alert(`Sent ${result.count} reminder email${result.count===1?'':'s'} for ${result.label}.`);

function openRecordPaymentModal(s){
  const today = new Date().toISOString().slice(0,10);
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal"><div class="modal-inner">
      <span class="close" id="closeModal">&times;</span>
      <h3>Record Payment</h3>
      <p class="hint">${esc(s.name)} (${s.id})</p>
      <form id="recordPaymentForm">
        <div class="field"><label>Amount paid</label><input id="rp_amount" inputmode="decimal" placeholder="e.g. 600" required></div>
        <div class="field"><label>Date paid</label><input id="rp_date" type="date" value="${today}" required></div>
        <div class="field"><label>Payment method (optional)</label><input id="rp_method" placeholder="e.g. Zelle, check, cash"></div>
        <div class="field"><label>Note (optional)</label><textarea id="rp_note" placeholder="e.g. which job this covers"></textarea></div>
        <button type="submit" class="btn block" id="rpSubmit">Save Payment</button>
      </form>
      <div id="rpMsg"></div>
    </div></div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('closeModal').onclick = ()=> backdrop.remove();
  backdrop.onclick = (e)=>{ if(e.target===backdrop) backdrop.remove(); };
  document.getElementById('recordPaymentForm').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('rpSubmit'); btn.disabled = true; btn.textContent = 'Saving…';
    try{
      const amountCents = dollarsToCents(document.getElementById('rp_amount').value);
      const dateVal = document.getElementById('rp_date').value;
      const paidAt = new Date(dateVal + 'T12:00:00').getTime();
      const method = document.getElementById('rp_method').value.trim();
      const note = document.getElementById('rp_note').value.trim();
      const events = [{ event:'Recorded as paid', at: now() }];
      if(note) events.push({ event:`Note: ${note}`, at: now() });
      await db.collection('payouts').add({
        subcontractorId: s.id, subcontractorName: s.name,
        jobId: null, jobNumber: null, jobLabel: note || 'Manual payment',        amountCents, status:'PAID',
        completedAt: null, paidAt, method, referenceId:'',
        history: events, createdAt: now()
      });
      backdrop.remove();
    }catch(err){
      document.getElementById('rpMsg').innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Save Payment';
    }
  };
}

function renderAdminMileageTab(main){
  const nowD = new Date();
  const startOfWeek = new Date(nowD); startOfWeek.setDate(nowD.getDate()-nowD.getDay()); startOfWeek.setHours(0,0,0,0);
  const startOfMonth = new Date(nowD.getFullYear(), nowD.getMonth(), 1);
  const startOfYear = new Date(nowD.getFullYear(), 0, 1);

  const active = adminData.adminMileage;
  const sumSince = (t)=> active.filter(m=>m.date>=t.getTime()).reduce((s,m)=>s+(m.miles||0),0);

  let filtered = active;
  if(mileageFilter==='week') filtered = active.filter(m=>m.date>=startOfWeek.getTime());
  else if(mileageFilter==='month') filtered = active.filter(m=>m.date>=startOfMonth.getTime());
  else if(mileageFilter==='year') filtered = active.filter(m=>m.date>=startOfYear.getTime());
  filtered = filtered.slice().sort((a,b)=>b.date-a.date);

  main.innerHTML = `
    <h2 class="section">${nowD.getFullYear()} Mileage</h2>
    <div class="hint">Your own mileage records — for your tax deductions.</div>
    <div class="stat-grid tri" style="margin:12px 0 18px;">
      <div class="stat"><div class="num">${sumSince(startOfYear).toFixed(1)}</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num">${sumSince(startOfMonth).toFixed(1)}</div><div class="lbl">This Month</div></div>
      <div class="stat"><div class="num">${sumSince(startOfWeek).toFixed(1)}</div><div class="lbl">This Week</div></div>
    </div>
    <div class="filter-row">
      ${['week','month','year','all'].map(f=>`<button data-mfilter="${f}" class="${mileageFilter===f?'active':''}">${f==='all'?'All time':f[0].toUpperCase()+f.slice(1)}</button>`).join('')}
      <button class="btn small secondary" id="addAdminMileageBtn">+ Add Mileage</button>
      <button class="btn small secondary" id="exportAdminCsv">Export CSV</button>
    </div>
    <table class="ledger">
      <tr><th>Date</th><th>Note</th><th>Miles</th><th></th></tr>
      ${filtered.map(m=>`
        <tr>
          <td>${fmtDate(m.date)}</td>
          <td>${esc(m.jobLabel||'')}</td>
          <td>${(m.miles||0).toFixed(1)}</td>
          <td><span class="link-btn" data-admin-edit-mileage="${m.id}">Edit</span></td>
        </tr>
      `).join('') || `<tr><td colspan="4" style="padding:20px 4px;color:var(--ink-soft);">No entries in this range.</td></tr>`}
    </table>
  `;
  main.querySelectorAll('[data-mfilter]').forEach(b=>{ b.onclick = ()=>{ mileageFilter=b.dataset.mfilter; renderApp(); }; });
  document.getElementById('addAdminMileageBtn').onclick = openAddAdminMileageModal;
  document.getElementById('exportAdminCsv').onclick = ()=>{
    const rows = [['Date','Note','Miles']].concat(filtered.map(m=>[new Date(m.date).toISOString().slice(0,10), (m.jobLabel||'').replace(/,/g,' '), (m.miles||0).toFixed(1)]));
    const csv = rows.map(r=>r.join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `admin-mileage-${mileageFilter}-${Date.now()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  main.querySelectorAll('[data-admin-edit-mileage]').forEach(el=>{
    el.onclick = ()=> openEditAdminMileageModal(el.dataset.adminEditMileage);
  });
}

/* ================= SUBCONTRACTOR ================= */
function subscribeSub(){
  const subId = myRole.subcontractorId;
  unsubs.push(db.collection('subcontractors').doc(subId).onSnapshot(d=>{
    if(d.exists) mySubDoc = d.data();
    if(!d.exists || mySubDoc.status!=='ACTIVE'){ auth.signOut(); return; }
    if(mySubDoc.mustChangePin || !mySubDoc.onboardingComplete){ clearListeners(); proceedAfterSubAuth(); return; }
    renderApp();
  }));
  unsubs.push(db.collection('jobs').where('status','==','AVAILABLE').onSnapshot(qs=>{
    subData.availableJobs = qs.docs.map(d=>({id:d.id, ...d.data()}));
    renderApp();
  }, e=>console.error(e)));
  unsubs.push(db.collection('jobs').where('offeredToId','==',subId).onSnapshot(qs=>{
    subData.offeredJobs = qs.docs.map(d=>({id:d.id, ...d.data()})).filter(j=>j.status==='OFFERED');
    renderApp();
  }, e=>console.error(e)));
  unsubs.push(db.collection('jobs').where('assignedSubcontractorId','==',subId).onSnapshot(qs=>{
    subData.myJobs = qs.docs.map(d=>({id:d.id, ...d.data()}));
    renderApp();
  }, e=>console.error(e)));
  unsubs.push(db.collection('payouts').where('subcontractorId','==',subId).onSnapshot(qs=>{
    subData.payouts = qs.docs.map(d=>({id:d.id, ...d.data()}));
    renderApp();
  }, e=>console.error(e)));
  unsubs.push(db.collection('mileage').where('subcontractorId','==',subId).onSnapshot(qs=>{
    subData.mileage = qs.docs.map(d=>({id:d.id, ...d.data()}));
    renderApp();
  }, e=>console.error(e)));
}

  if(activeTab==='profile') renderSubProfile(main);
}

function subJobCardHtml(j, mode){
  let controls = '';
  if(mode==='available'){
    const iAmInterested = (j.interestedUids||[]).includes(me.uid);
    controls = `<button class="btn block ${iAmInterested?'secondary':''}" data-interest="${j.id}" data-value="${iAmInterested?'0':'1'}">${iAmInterested?"You're marked available — tap to undo":"I'm Available"}</button>`;
  }else if(mode==='offered'){
    controls = `<div class="status-buttons"><button data-respond="${j.id}" data-value="ACCEPTED" style="background:var(--moss);color:#fff;border-color:var(--moss);">Accept</button><button data-respond="${j.id}" data-value="DECLINED">Decline</button></div>`;
  }else if(mode==='mine'){
    if(j.status==='ASSIGNED' || j.status==='SCHEDULED') controls = `<button class="btn block" data-advance="${j.id}" data-value="ON_THE_WAY">On the way</button>`;
    else if(j.status==='ON_THE_WAY') controls = `<button class="btn block" data-advance="${j.id}" data-value="IN_PROGRESS">Start job</button>`;
    else if(j.status==='IN_PROGRESS') controls = `<button class="btn block" data-complete="${j.id}">Mark Job Complete</button>`;
    else if(j.status==='COMPLETED' || j.status==='PAID') controls = `<span style="color:var(--moss);font-weight:600;">✓ Completed</span>`;
  }
  const showCustomer = mode==='mine';
  return `
    <div class="card">
      <div class="card-top">
        <div><div class="card-title">Job #${j.jobNumber} — ${esc(j.jobType||'General')}</div>
        <div class="card-sub">${esc((j.scope||'').slice(0,90))}</div></div>
        <span class="stamp ${stampClass(j.status)}">${statusLabel(j.status)}</span>
      </div>
      <div class="perf"></div>
      <div class="card-body">
        <div class="card-meta">
          <div>${esc(j.customer?.address)}</div>
          ${j.scheduledDate?`<div>Scheduled: ${esc(j.scheduledDate)}</div>`:''}
          ${j.estimatedDuration?`<div>Duration: ${esc(j.estimatedDuration)}</div>`:''}
          <div class="pay">Pay: ${centsToStr(j.payoutCents)}</div>
          ${showCustomer?`<div style="margin-top:6px;"><strong>${esc(j.customer?.name)}</strong></div><div>${esc(j.customer?.phone)}</div>`:''}
        </div>
        ${controls}
      </div>
    </div>
  `;
}

function wireSubControls(main){
  main.querySelectorAll('[data-interest]').forEach(btn=>{
    btn.onclick = async ()=>{
      const add = btn.dataset.value==='1';
      await db.collection('jobs').doc(btn.dataset.interest).update({
        interestedUids: add ? firebase.firestore.FieldValue.arrayUnion(me.uid) : firebase.firestore.FieldValue.arrayRemove(me.uid)   });
    };
  });
  main.querySelectorAll('[data-respond]').forEach(btn=>{
    btn.onclick = async ()=>{
      const status = btn.dataset.value;
      await db.collection('jobs').doc(btn.dataset.respond).update({
        status, timeline: firebase.firestore.FieldValue.arrayUnion({event:`${status==='ACCEPTED'?'Accepted':'Declined'} by ${mySubDoc.name}`, at: now()})
      });
    };
  });
  main.querySelectorAll('[data-advance]').forEach(btn=>{
    btn.onclick = async ()=>{
      const status = btn.dataset.value;
      await db.collection('jobs').doc(btn.dataset.advance).update({

function openCompleteJobModal(jobId){
  const j = subData.myJobs.find(x=>x.id===jobId);
  if(!j) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal"><div class="modal-inner">
      <span class="close" id="closeModal">&times;</span>
      <h3>Complete Job</h3>
      <p>Job #${j.jobNumber}<br>${esc(j.jobType||'')}</p>
      <div class="field"><label>Miles driven (optional, private to you — for your own records)</label><input id="c_miles" inputmode="decimal" placeholder="e.g. 38.4"></div>
      <label class="checkline"><input type="checkbox" id="c_confirm"> I confirm the job has been completed</label>
      <button class="btn block" id="submitComplete" disabled>Submit Completion</button>
    </div></div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('closeModal').onclick = ()=> backdrop.remove();
  document.getElementById('c_confirm').onchange = (e)=>{ document.getElementById('submitComplete').disabled = !e.target.checked; };
  document.getElementById('submitComplete').onclick = async ()=>{
    const btn = document.getElementById('submitComplete'); btn.disabled = true; btn.textContent = 'Submitting…';
    try{
      const completedAt = now();
      await db.collection('jobs').doc(j.id).update({
        status:'COMPLETED',
        timeline: firebase.firestore.FieldValue.arrayUnion({event:'Job completed', at: completedAt})
      });
      const milesVal = document.getElementById('c_miles').value.trim();
      if(milesVal){
        await db.collection('mileage').add({
          subcontractorUid: me.uid, subcontractorId: myRole.subcontractorId,
          jobId: j.id, jobLabel: `Job #${j.jobNumber} — ${j.jobType||''}`,
          miles: parseFloat(milesVal), date: completedAt, correctionOf: null, createdAt: completedAt
        });
      }
      await db.collection('payouts').doc(j.id).set({
        subcontractorUid: me.uid, subcontractorId: myRole.subcontractorId, subcontractorName: mySubDoc.name,
        jobId: j.id, jobNumber: j.jobNumber, jobLabel: j.jobType||'',
        amountCents: j.payoutCents||0, status:'PENDING',
        completedAt, paidAt:null, method:'', referenceId:'',
        history:[{event:'Payout created', at: completedAt}],
        createdAt: completedAt
      });
      backdrop.remove();
    }catch(err){
      console.error(err);
      alert('Could not complete job: ' + err.message);
      btn.disabled = false; btn.textContent = 'Submit Completion';
    }
  };
}

function openPayoutDisputeModal(p){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal"><div class="modal-inner">
      <span class="close" id="closeModal">&times;</span>
      <h3>Payment Looks Incorrect</h3>
      <p class="hint">${p.jobId ? `Job #${p.jobNumber}` : 'Payment'} — ${centsToStr(p.amountCents)}${p.paidAt ? ', paid '+fmtDate(p.paidAt) : ''}. This notifies the admin so he can review it.</p>
      <form id="disputeForm">
        <div class="field"><label>What looks wrong?</label><textarea id="d_note" required placeholder="e.g. this should have been \$650, not \$600"></textarea></div>
        <button type="submit" class="btn block">Notify Admin</button>
      </form>
      <div id="disputeMsg"></div>
    </div></div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('closeModal').onclick = ()=> backdrop.remove();
  backdrop.onclick = (e)=>{ if(e.target===backdrop) backdrop.remove(); };
  document.getElementById('disputeForm').onsubmit = async (e)=>{
    e.preventDefault();
    const note = document.getElementById('d_note').value.trim();
    try{
      await db.collection('supportRequests').add({
        type: 'PAYOUT_DISPUTE',
        subcontractorId: myRole.subcontractorId,
        name: mySubDoc.name, phone: mySubDoc.phone || '',
        payoutId: p.id, jobNumber: p.jobNumber || null, amountCents: p.amountCents || 0,
        note, status: 'NEW', createdAt: now()
      });
      sendNotificationEmail({
        to_email: ADMIN_EMAIL,
        subject: `Payment Dispute — ${mySubDoc.name} (${myRole.subcontractorId})`,
        heading: 'Payment Looks Incorrect',
        body_html: `<p style="margin:0 0 16px;">${esc(mySubDoc.name)} (${esc(myRole.subcontractorId)}) says a payment looks incorrect: "${esc(note)}"</p>
          <table style="width:100%;border-collapse:collapse;">
            <tr><td style="padding:6px 0;font-weight:bold;width:140px;">Subcontractor ID:</td><td>${esc(myRole.subcontractorId)}</td></tr>
            <tr><td style="padding:6px 0;font-weight:bold;">Name:</td><td>${esc(mySubDoc.name)}</td></tr>
            <tr><td style="padding:6px 0;font-weight:bold;">Phone:</td><td>${esc(mySubDoc.phone||'')}</td></tr>
          </table>`,
        footer_note: 'This is also waiting for you in the Inbox tab of the portal.'
      });
      document.getElementById('disputeForm').style.display='none';
      document.getElementById('disputeMsg').innerHTML = '<div class="msg">Sent — the admin has been notified.</div>';
    }catch(err){
      document.getElementById('disputeMsg').innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
    }
  };
}

function renderSubMileage(main){
  const nowD = new Date();
  const startOfWeek = new Date(nowD); startOfWeek.setDate(nowD.getDate()-nowD.getDay()); startOfWeek.setHours(0,0,0,0);
  const startOfMonth = new Date(nowD.getFullYear(), nowD.getMonth(), 1);
  const startOfYear = new Date(nowD.getFullYear(), 0, 1);

  const active = subData.mileage.filter(m => !subData.mileage.some(other=>other.correctionOf===m.id)); // superseded entries hidden
  const sumSince = (t)=> active.filter(m=>m.date>=t.getTime()).reduce((s,m)=>s+(m.miles||0),0);

  let filtered = active;
  if(mileageFilter==='week') filtered = active.filter(m=>m.date>=startOfWeek.getTime());
  else if(mileageFilter==='month') filtered = active.filter(m=>m.date>=startOfMonth.getTime());
  else if(mileageFilter==='year') filtered = active.filter(m=>m.date>=startOfYear.getTime());
  filtered = filtered.slice().sort((a,b)=>b.date-a.date);

  main.innerHTML = `
    <h2 class="section">${nowD.getFullYear()} Mileage</h2>
    <div class="hint">Private to you — never visible to the admin. For your own tax records.</div>
    <div class="stat-grid tri" style="margin:12px 0 18px;">
      <div class="stat"><div class="num">${sumSince(startOfYear).toFixed(1)}</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num">${sumSince(startOfMonth).toFixed(1)}</div><div class="lbl">This Month</div></div>
      <div class="stat"><div class="num">${sumSince(startOfWeek).toFixed(1)}</div><div class="lbl">This Week</div></div>
    </div>
    <div class="filter-row">
      ${['week','month','year','all'].map(f=>`<button data-mfilter="${f}" class="${mileageFilter===f?'active':''}">${f==='all'?'All time':f[0].toUpperCase()+f.slice(1)}</button>`).join('')}
      <button class="btn small secondary" id="addMileageBtn">+ Add Mileage</button>
      <button class="btn small secondary" id="exportCsv">Export CSV</button>
    </div>
    <table class="ledger">
      <tr><th>Date</th><th>Job</th><th>Miles</th><th></th></tr>
      ${filtered.map(m=>`
        <tr>
          <td>${fmtDate(m.date)}</td>
          <td>${esc(m.jobLabel||'')}</td>
          <td>${(m.miles||0).toFixed(1)}</td>
          <td><span class="link-btn" data-correct="${m.id}">Edit</span></td>
        </tr>
      `).join('') || `<tr><td colspan="4" style="padding:20px 4px;color:var(--ink-soft);">No entries in this range.</td></tr>`}
    </table>
  `;
  main.querySelectorAll('[data-mfilter]').forEach(b=>{ b.onclick = ()=>{ mileageFilter=b.dataset.mfilter; renderApp(); }; });
  document.getElementById('addMileageBtn').onclick = openAddMileageModal;
  document.getElementById('exportCsv').onclick = ()=>{
    const rows = [['Date','Job','Miles']].concat(filtered.map(m=>[new Date(m.date).toISOString().slice(0,10), (m.jobLabel||'').replace(/,/g,' '), (m.miles||0).toFixed(1)]));
    const csv = rows.map(r=>r.join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `mileage-${mileageFilter}-${Date.now()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  main.querySelectorAll('[data-correct]').forEach(el=>{
    el.onclick = ()=> openMileageCorrectionModal(el.dataset.correct);
  });
}

      <span class="close" id="closeModal">&times;</span>
      <h3>Change My PIN</h3>
      <div class="field"><label>Current PIN</label><input id="cp_old" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>
      <div class="field"><label>New 4-digit PIN</label><input id="cp_new" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>
      <div class="field"><label>Confirm new PIN</label><input id="cp_new2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>
      <div id="cpMsg"></div>
      <button class="btn block" id="cpSubmit">Save New PIN</button>
    </div></div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('closeModal').onclick = ()=> backdrop.remove();
  document.getElementById('cpSubmit').onclick = async ()=>{
    const oldPin = document.getElementById('cp_old').value.trim();
    const p1 = document.getElementById('cp_new').value.trim();
    const p2 = document.getElementById('cp_new2').value.trim();
    if(!/^\d{4}$/.test(p1) || p1!==p2){
      document.getElementById('cpMsg').innerHTML = '<div class="msg error">New PINs must match and be 4 digits.</div>'; return;
    }
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(me.email, pinToPassword(oldPin));
      await auth.currentUser.reauthenticateWithCredential(cred);
      await auth.currentUser.updatePassword(pinToPassword(p1));
      backdrop.remove();
    }catch(err){
      document.getElementById('cpMsg').innerHTML = `<div class="msg error">Current PIN was wrong.</div>`;
    }
  };
}
</script>
</body>
</html>
